<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Логічні оператори</title>
</head>
<body>
    
    <div id="output"></div>

    <script>
        let output = document.getElementById("output")

        let x = Number(prompt("Введіть перше число"))
        let y = Number(prompt("Введіть друге число"))
        let z = Number(prompt("Введіть третє число"))

        let max = x
        if (y > max) max = y
        if (z > max) max = z

        let min = x
        if (y < min) min = y
        if (z < min) min = z

        output.innerHTML += `<p>Найбільше число: ${max}</p>`
        output.innerHTML += `<p>Найменше число: ${min}</p>`

        let hasEven = (x % 2 === 0) || (y % 2 === 0) || (z % 2 === 0)
        output.innerHTML += `<p>Хоча б одне число парне: ${hasEven}</p>`

        let complexCheck = (x > y) && (y < z)
        output.innerHTML += `<p>Складна умова (x>y і y<z): ${complexCheck}</p>`

        let n = Number(prompt("Введіть число для перевірки на просте"))
        let isPrime = true
        if (n < 2) {
            isPrime = false
        } else {
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    isPrime = false
                    break
                }
            }
        }
        output.innerHTML += `<p>Число просте: ${isPrime}</p>`
    </script>
</body>
</html>
