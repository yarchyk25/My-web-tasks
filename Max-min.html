<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Max Min</title>
</head>

<body>

    <script>

        function findMaxMin(arr) {

            let max = arr[0]
            let min = arr[0]

            for (let num of arr) {

                if (num > max) {
                    max = num
                }

                if (num < min) {
                    min = num
                }

            }

            return { max: max, min: min }

        }

        let numbers = [5, 8, 2, 14, 7, 1]

        let result = findMaxMin(numbers)

        console.log(result)

    </script>

</body>

</html>
