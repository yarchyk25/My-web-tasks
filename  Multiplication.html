<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Таблиця множення</title>
</head>

<body>

    <script>

        let n = Number(prompt("Введіть число"))

        for (let i = 1; i <= 10; i++) {
            console.log(n + " x " + i + " = " + (n * i))
        }

    </script>

</body>

</html>
