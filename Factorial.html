<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Факторіал</title>
</head>

<body>

    <script>

        function factorial(n) {

            let result = 1

            for (let i = 1; i <= n; i++) {
                result = result * i
            }

            return result
        }

        let n = Number(prompt("Введіть число"))

        console.log("Факторіал:", factorial(n))

    </script>

</body>

</html>
