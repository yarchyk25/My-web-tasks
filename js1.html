<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>js pract</title>
</head>
<body>

    <script>
        let apples = 8
        console.log(apples, typeof apples)

        apples = apples + 2
        console.log(apples, typeof apples)

        let price = 4.7
        console.log(price, typeof price)

        price = price * 2
        console.log(price, typeof price)

        let user = "Yaroslav"
        console.log(user, typeof user)

        user = user + " student"
        console.log(user, typeof user)

        let isStudent = true
        console.log(isStudent, typeof isStudent)

        isStudent = !isStudent
        console.log(isStudent, typeof isStudent)

        let mix = "Age: " + 18
        console.log(mix, typeof mix)

        let numberFromString = Number("25")
        console.log(numberFromString, typeof numberFromString)

        let boolToNumber = Number(false)
        console.log(boolToNumber, typeof boolToNumber)

        let profile = {
            name: "Yaroslav",
            age: 18,
            student: true,
            rating: 4.5
        }

        console.log(JSON.stringify(profile))
    </script>
</body>
</html>
